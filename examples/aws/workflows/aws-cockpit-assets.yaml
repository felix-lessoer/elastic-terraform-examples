name: AWS Cockpit Asset Inventory
id: aws-cockpit-assets
description: >-
  Builds a live EC2/S3 asset inventory from Observability metrics into
  aws-cockpit-assets for the cockpit inventory panels.
triggers:
  - type: manual
  - type: scheduled
    with:
      every: "1h"

steps:
  - name: query_ec2
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM aws-cockpit-assets
        | WHERE @timestamp > NOW() - 24 hours
            AND resource.type == "ec2_instance"
        | STATS avg_cpu = MAX(metric_value), last_seen = MAX(last_seen)
            BY resource.id, resource.name, resource.key, cloud.region, cloud.availability_zone, cloud.account.id, cloud.machine.type
        | SORT avg_cpu ASC
        | LIMIT 200

  - name: map_ec2
    type: data.map
    items: "${{ steps.query_ec2.output.values }}"
    with:
      fields:
        avg_cpu: "{{ item[0] }}"
        last_seen: "{{ item[1] }}"
        instance_id: "{{ item[2] }}"
        instance_name: "{{ item[3] }}"
        resource_key: "{{ item[4] }}"
        region: "{{ item[5] }}"
        availability_zone: "{{ item[6] }}"
        account_id: "{{ item[7] }}"
        machine_type: "{{ item[8] }}"

  - name: index_ec2
    type: foreach
    foreach: "${{ steps.map_ec2.output }}"
    steps:
      - name: write_ec2
        type: elasticsearch.index
        with:
          index: aws-cockpit-assets
          id: "ec2-{{ foreach.item.instance_id }}"
          document:
            "@timestamp": "{{ now | date_to_xmlschema }}"
            resource:
              type: ec2_instance
              name: "{{ foreach.item.instance_name }}"
              id: "{{ foreach.item.instance_id }}"
              key: "{{ foreach.item.resource_key }}"
            cloud:
              region: "{{ foreach.item.region }}"
              availability_zone: "{{ foreach.item.availability_zone }}"
              account:
                id: "{{ foreach.item.account_id }}"
              machine:
                type: "{{ foreach.item.machine_type }}"
            metric_name: cpu_avg_24h
            metric_value: "{{ foreach.item.avg_cpu }}"
            last_seen: "{{ foreach.item.last_seen }}"

  - name: query_s3
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM aws-cockpit-assets
        | WHERE @timestamp > NOW() - 7 days
            AND resource.type == "s3_bucket"
        | STATS max_size = MAX(metric_value), last_seen = MAX(last_seen)
            BY resource.name, resource.key, cloud.region, cloud.account.id
        | SORT max_size DESC
        | LIMIT 300

  - name: map_s3
    type: data.map
    items: "${{ steps.query_s3.output.values }}"
    with:
      fields:
        max_size: "{{ item[0] }}"
        last_seen: "{{ item[1] }}"
        bucket: "{{ item[2] }}"
        resource_key: "{{ item[3] }}"
        region: "{{ item[4] }}"
        account_id: "{{ item[5] }}"

  - name: index_s3
    type: foreach
    foreach: "${{ steps.map_s3.output }}"
    steps:
      - name: write_s3
        type: elasticsearch.index
        with:
          index: aws-cockpit-assets
          id: "s3-{{ foreach.item.bucket }}"
          document:
            "@timestamp": "{{ now | date_to_xmlschema }}"
            resource:
              type: s3_bucket
              name: "{{ foreach.item.bucket }}"
              id: "{{ foreach.item.bucket }}"
              key: "{{ foreach.item.resource_key }}"
            cloud:
              region: "{{ foreach.item.region }}"
              account:
                id: "{{ foreach.item.account_id }}"
            metric_name: bucket_size_bytes
            metric_value: "{{ foreach.item.max_size }}"
            last_seen: "{{ foreach.item.last_seen }}"
