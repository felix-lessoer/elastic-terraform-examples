name: AWS Insight Engine — EC2
id: aws-cockpit-ec2-recommendations
description: >-
  Converts raw EC2 CloudWatch metrics into cost and performance insights in
  aws-cockpit-recommendations for the AWS Insight Engine.

triggers:
  - type: manual
  - type: scheduled
    with:
      every: "1h"

steps:
  - name: remove_previous_ec2_insights
    type: elasticsearch.request
    with:
      method: POST
      path: /aws-cockpit-recommendations/_delete_by_query?conflicts=proceed&refresh=true
      body:
        query:
          term:
            resource.type: ec2_instance

  - name: query_metrics
    type: elasticsearch.esql.query
    with:
      query: |
        FROM metrics-aws.ec2_metrics-default
        | WHERE @timestamp > NOW() - 24 hours
        | STATS avg_cpu = AVG(aws.ec2.metrics.CPUUtilization.avg), max_status_failed = MAX(aws.ec2.metrics.StatusCheckFailed.avg) BY cloud.instance.name, cloud.instance.id, cloud.availability_zone, cloud.account.id, cloud.region, cloud.machine.type
        | WHERE max_status_failed > 0 OR avg_cpu < 5 OR avg_cpu > 85
        | LIMIT 200

  - name: normalize_metrics
    type: data.map
    items: "${{ steps.query_metrics.output.values }}"
    with:
      fields:
        avg_cpu: "{{ item[0] }}"
        status_failed: "{{ item[1] }}"
        instance_name: "{{ item[2] }}"
        instance_id: "{{ item[3] }}"
        availability_zone: "{{ item[4] }}"
        account_id: "{{ item[5] }}"
        region: "{{ item[6] }}"
        machine_type: "{{ item[7] }}"

  - name: process_metrics
    type: foreach
    foreach: "${{ steps.normalize_metrics.output }}"
    steps:
      - name: check_status_failed
        type: if
        condition: "foreach.item.status_failed > 0"
        steps:
          - name: index_status_check_recommendation
            type: elasticsearch.index
            with:
              index: aws-cockpit-recommendations
              id: "{{ foreach.item.instance_id }}-status_check"
              document:
                "@timestamp": "{{ now | date_to_xmlschema }}"
                category: performance_risk
                severity: high
                metric_name: status_check_failed
                metric_value: "{{ foreach.item.status_failed }}"
                threshold: 0
                recommendation: >-
                  Instance {{ foreach.item.instance_name }} has failing status
                  checks (value {{ foreach.item.status_failed }}). Investigate
                  immediately as the instance may be unreachable or degraded.
                resource:
                  type: ec2_instance
                  name: "{{ foreach.item.instance_name }}"
                  id: "{{ foreach.item.instance_id }}"
                  key: "{{ foreach.item.region }}:ec2_instance:{{ foreach.item.instance_id }}"
                cloud:
                  availability_zone: "{{ foreach.item.availability_zone }}"
                  account:
                    id: "{{ foreach.item.account_id }}"
                  region: "{{ foreach.item.region }}"

      - name: check_underutilized_cpu
        type: if
        condition: "foreach.item.avg_cpu < 5"
        steps:
          - name: index_cost_optimization_recommendation
            type: elasticsearch.index
            with:
              index: aws-cockpit-recommendations
              id: "{{ foreach.item.instance_id }}-cost_optimization"
              document:
                "@timestamp": "{{ now | date_to_xmlschema }}"
                category: cost_optimization
                severity: medium
                metric_name: avg_cpu_pct
                metric_value: "{{ foreach.item.avg_cpu }}"
                threshold: 5
                recommendation: >-
                  Instance {{ foreach.item.instance_name }} is underutilized
                  (avg CPU {{ foreach.item.avg_cpu | round: 2 }}%). Consider
                  downsizing or stopping this instance to reduce cost.
                resource:
                  type: ec2_instance
                  name: "{{ foreach.item.instance_name }}"
                  id: "{{ foreach.item.instance_id }}"
                  key: "{{ foreach.item.region }}:ec2_instance:{{ foreach.item.instance_id }}"
                cloud:
                  availability_zone: "{{ foreach.item.availability_zone }}"
                  account:
                    id: "{{ foreach.item.account_id }}"
                  region: "{{ foreach.item.region }}"

      - name: check_near_capacity_cpu
        type: if
        condition: "foreach.item.avg_cpu > 85"
        steps:
          - name: index_performance_risk_recommendation
            type: elasticsearch.index
            with:
              index: aws-cockpit-recommendations
              id: "{{ foreach.item.instance_id }}-performance_risk"
              document:
                "@timestamp": "{{ now | date_to_xmlschema }}"
                category: performance_risk
                severity: high
                metric_name: avg_cpu_pct
                metric_value: "{{ foreach.item.avg_cpu }}"
                threshold: 85
                recommendation: >-
                  Instance {{ foreach.item.instance_name }} is near CPU
                  capacity (avg CPU {{ foreach.item.avg_cpu | round: 2 }}%).
                  Consider scaling up or adding additional capacity.
                resource:
                  type: ec2_instance
                  name: "{{ foreach.item.instance_name }}"
                  id: "{{ foreach.item.instance_id }}"
                  key: "{{ foreach.item.region }}:ec2_instance:{{ foreach.item.instance_id }}"
                cloud:
                  availability_zone: "{{ foreach.item.availability_zone }}"
                  account:
                    id: "{{ foreach.item.account_id }}"
                  region: "{{ foreach.item.region }}"

  - name: query_potentially_unused_instances
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM metrics-aws.ec2_metrics*
        | WHERE @timestamp > NOW() - 14 days
        | STATS observations = COUNT(*),
                avg_cpu = AVG(aws.ec2.metrics.CPUUtilization.avg),
                network_in = SUM(aws.ec2.metrics.NetworkIn.sum),
                network_out = SUM(aws.ec2.metrics.NetworkOut.sum)
            BY instance_name = cloud.instance.name,
               instance_id = cloud.instance.id,
               cloud.region, cloud.account.id
        | WHERE instance_id IS NOT NULL
            AND avg_cpu < 1
            AND network_in IS NOT NULL
            AND network_out IS NOT NULL
            AND network_in + network_out < 10485760
        | EVAL network_bytes = TO_DOUBLE(network_in) + TO_DOUBLE(network_out)
        | LIMIT 200

  - name: map_potentially_unused_instances
    type: data.map
    items: "${{ steps.query_potentially_unused_instances.output.values }}"
    with:
      fields:
        observations: "{{ item[0] }}"
        avg_cpu: "{{ item[1] }}"
        network_in: "{{ item[2] }}"
        network_out: "{{ item[3] }}"
        instance_name: "{{ item[4] }}"
        instance_id: "{{ item[5] }}"
        region: "{{ item[6] }}"
        account_id: "{{ item[7] }}"
        network_bytes: "{{ item[8] }}"

  - name: publish_potentially_unused_instances
    type: foreach
    foreach: "${{ steps.map_potentially_unused_instances.output }}"
    steps:
      - name: index_potentially_unused_instance
        type: elasticsearch.index
        with:
          index: aws-cockpit-recommendations
          id: "{{ foreach.item.instance_id }}-potentially-unused"
          document:
            "@timestamp": "{{ now | date_to_xmlschema }}"
            category: unused_resource
            severity: medium
            confidence: high
            activity_status: potentially_unused
            lookback_days: 14
            metric_name: network_bytes_14d
            metric_value: "{{ foreach.item.network_bytes }}"
            threshold: 10485760
            recommendation: >-
              EC2 instance {{ foreach.item.instance_name }} averaged less than
              1% CPU and transferred less than 10 MiB over 14 days across {{
              foreach.item.observations }} observed metric documents. Confirm
              owner and dependency requirements before stopping or removing it.
            resource:
              type: ec2_instance
              name: "{{ foreach.item.instance_name }}"
              id: "{{ foreach.item.instance_id }}"
              key: "{{ foreach.item.region }}:ec2_instance:{{ foreach.item.instance_id }}"
            cloud:
              region: "{{ foreach.item.region }}"
              account:
                id: "{{ foreach.item.account_id }}"
