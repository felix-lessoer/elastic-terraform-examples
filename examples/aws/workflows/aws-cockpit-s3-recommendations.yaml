name: AWS Insight Engine — S3
id: aws-cockpit-s3-recommendations
description: >-
  Converts the workflow-generated S3 asset inventory into utilization and cost
  insights in aws-cockpit-recommendations for the AWS Insight Engine.
triggers:
  - type: manual
  - type: scheduled
    with:
      every: "1h"

steps:
  - name: remove_previous_s3_insights
    type: elasticsearch.request
    with:
      method: POST
      path: /aws-cockpit-recommendations/_delete_by_query?conflicts=proceed&refresh=true
      body:
        query:
          term:
            resource.type: s3_bucket

  - name: find_empty_buckets
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM aws-cockpit-assets
        | WHERE @timestamp > NOW() - 7 days
            AND resource.type == "s3_bucket"
            AND metric_name == "bucket_size_bytes"
        | STATS max_size = MAX(metric_value) BY resource.name, cloud.region, cloud.account.id
        | WHERE max_size == 0

  - name: map_empty_buckets
    type: data.map
    items: "${{ steps.find_empty_buckets.output.values }}"
    with:
      fields:
        max_size: "{{ item[0] }}"
        bucket: "{{ item[1] }}"
        region: "{{ item[2] }}"
        account_id: "{{ item[3] }}"

  - name: process_empty_buckets
    type: foreach
    foreach: "${{ steps.map_empty_buckets.output }}"
    steps:
      - name: index_recommendation
        type: elasticsearch.index
        with:
          index: aws-cockpit-recommendations
          id: "{{ foreach.item.bucket }}-empty_bucket"
          document:
            "@timestamp": "{{ now | date_to_xmlschema }}"
            category: cost_optimization
            severity: low
            metric_name: s3_bucket_size_bytes
            metric_value: "{{ foreach.item.max_size }}"
            threshold: 0
            recommendation: >-
              S3 bucket {{ foreach.item.bucket }} appears empty
              (size={{ foreach.item.max_size }} bytes) — confirm it is still needed or remove it.
            resource:
              type: s3_bucket
              name: "{{ foreach.item.bucket }}"
            cloud:
              region: "{{ foreach.item.region }}"
              account:
                id: "{{ foreach.item.account_id }}"
