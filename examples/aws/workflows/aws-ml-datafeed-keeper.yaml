name: AWS ML Datafeed Keeper
id: aws-ml-datafeed-keeper
description: >-
  Runs every five minutes and idempotently opens the AWS anomaly-detection jobs
  and starts their datafeeds once source indices exist.
triggers:
  - type: manual
  - type: scheduled
    with:
      every: "5m"

steps:
  - name: open_event_rate_job
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /_ml/anomaly_detectors/aws-event-rate/_open

  - name: start_event_rate_datafeed
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /_ml/datafeeds/datafeed-aws-event-rate/_start

  - name: open_security_findings_job
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /_ml/anomaly_detectors/aws-cspm-findings-rate/_open

  - name: start_security_findings_datafeed
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /_ml/datafeeds/datafeed-aws-cspm-findings-rate/_start
