name: GCP Cockpit Asset Inventory
id: gcp-cockpit-assets
description: Reconciles a bounded, current GCE/GCS metric-observed asset snapshot.
triggers:
  - type: manual
  - type: scheduled
    with: {every: "1h"}
steps:
  - name: remove_previous_assets
    type: elasticsearch.request
    with:
      method: POST
      path: /gcp-cockpit-assets/_delete_by_query?conflicts=proceed&refresh=true
      body: {query: {match_all: {}}}
  - name: query_compute
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM metrics-gcp.compute-default
        | WHERE @timestamp > NOW() - 24 hours
        | STATS avg_cpu = AVG(gcp.compute.instance.cpu.usage.pct), last_seen = MAX(@timestamp)
          BY instance_id = cloud.instance.id, instance_name = cloud.instance.name,
             zone = cloud.availability_zone, region = cloud.region,
             project_id = cloud.account.id, machine_type = cloud.machine.type
        | WHERE instance_id IS NOT NULL
        | LIMIT 200
  - name: map_compute
    type: data.map
    items: "${{ steps.query_compute.output.values }}"
    with:
      fields:
        avg_cpu: "{{ item[0] }}"
        last_seen: "{{ item[1] }}"
        instance_id: "{{ item[2] }}"
        instance_name: "{{ item[3] }}"
        zone: "{{ item[4] }}"
        region: "{{ item[5] }}"
        project_id: "{{ item[6] }}"
        machine_type: "{{ item[7] }}"
  - name: index_compute
    type: foreach
    foreach: "${{ steps.map_compute.output }}"
    steps:
      - name: write_compute
        type: elasticsearch.index
        with:
          index: gcp-cockpit-assets
          id: "gce-{{ foreach.item.project_id }}-{{ foreach.item.instance_id }}"
          document:
            "@timestamp": "{{ now | date_to_xmlschema }}"
            resource:
              type: gce_instance
              name: "{{ foreach.item.instance_name }}"
              id: "{{ foreach.item.instance_id }}"
              key: "{{ foreach.item.project_id }}:{{ foreach.item.region }}:gce_instance:{{ foreach.item.instance_id }}"
            cloud:
              region: "{{ foreach.item.region }}"
              availability_zone: "{{ foreach.item.zone }}"
              project: {id: "{{ foreach.item.project_id }}"}
            metric_name: cpu_avg_24h
            metric_value: "{{ foreach.item.avg_cpu }}"
            last_seen: "{{ foreach.item.last_seen }}"
  - name: query_storage
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM metrics-gcp.storage-default
        | WHERE @timestamp > NOW() - 7 days
        | STATS max_bytes = MAX(gcp.storage.storage.total.bytes), last_seen = MAX(@timestamp)
          BY bucket = gcp.labels.resource.bucket_name,
             region = gcp.labels.resource.location, project_id = cloud.account.id
        | WHERE bucket IS NOT NULL
        | LIMIT 200
  - name: map_storage
    type: data.map
    items: "${{ steps.query_storage.output.values }}"
    with:
      fields:
        max_bytes: "{{ item[0] }}"
        last_seen: "{{ item[1] }}"
        bucket: "{{ item[2] }}"
        region: "{{ item[3] }}"
        project_id: "{{ item[4] }}"
  - name: index_storage
    type: foreach
    foreach: "${{ steps.map_storage.output }}"
    steps:
      - name: write_storage
        type: elasticsearch.index
        with:
          index: gcp-cockpit-assets
          id: "gcs-{{ foreach.item.project_id }}-{{ foreach.item.bucket }}"
          document:
            "@timestamp": "{{ now | date_to_xmlschema }}"
            resource:
              type: gcs_bucket
              name: "{{ foreach.item.bucket }}"
              id: "{{ foreach.item.bucket }}"
              key: "{{ foreach.item.project_id }}:{{ foreach.item.region }}:gcs_bucket:{{ foreach.item.bucket }}"
            cloud:
              region: "{{ foreach.item.region }}"
              project: {id: "{{ foreach.item.project_id }}"}
            metric_name: bucket_size_bytes
            metric_value: "{{ foreach.item.max_bytes }}"
            last_seen: "{{ foreach.item.last_seen }}"
