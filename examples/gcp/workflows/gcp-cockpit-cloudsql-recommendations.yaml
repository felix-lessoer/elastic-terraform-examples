name: GCP Cloud SQL Recommendations
id: gcp-cockpit-cloudsql-recommendations
description: >-
  Requires the cloudsql-gcp/metrics PostgreSQL stream. Maintains a bounded
  current snapshot of observed Cloud SQL memory pressure.

triggers:
  - type: manual
  - type: scheduled
    with:
      every: "1h"

steps:
  - name: remove_previous_cloudsql_insights
    type: elasticsearch.request
    with:
      method: POST
      path: /gcp-cockpit-recommendations/_delete_by_query?conflicts=proceed&refresh=true
      body: {query: {term: {resource.type: cloudsql_database}}}
  - name: query_cloudsql_memory
    type: elasticsearch.esql.query
    with:
      query: |
        FROM metrics-gcp.cloudsql_postgresql-default
        | WHERE @timestamp > NOW() - 24 hours
        | STATS observations = COUNT(*), avg_memory_frac = AVG(gcp.cloudsql_postgresql.database.memory.utilization.pct)
          BY database_id = gcp.labels.resource.database_id,
             region = gcp.labels.resource.region, project_id = cloud.account.id
        | EVAL avg_memory_pct = avg_memory_frac * 100
        | WHERE database_id IS NOT NULL AND avg_memory_pct > 85
        | KEEP observations, database_id, region, project_id, avg_memory_pct
        | LIMIT 200

  - name: build_recommendations
    type: data.map
    items: "${{ steps.query_cloudsql_memory.output.values }}"
    with:
      fields:
        observations: "{{ item[0] }}"
        database_id: "{{ item[1] }}"
        region: "{{ item[2] }}"
        project_id: "{{ item[3] }}"
        avg_memory_pct: "{{ item[4] }}"

  - name: write_recommendations
    type: foreach
    foreach: "${{ steps.build_recommendations.output }}"
    steps:
      - name: index_recommendation
        type: elasticsearch.index
        with:
          index: "gcp-cockpit-recommendations"
          id: "{{ foreach.item.project_id }}-{{ foreach.item.database_id }}-memory-pressure"
          document:
            "@timestamp": "{{ now | date_to_xmlschema }}"
            category: "performance_risk"
            severity: "high"
            confidence: high
            activity_status: observed
            lookback_days: 1
            evidence_refs: [gcp.cloudsql_postgresql.database.memory.utilization.pct]
            contradictory_evidence: []
            missing_telemetry: []
            expected_value: "Average memory utilization at or below 85%."
            safe_next_action: "Review query load and memory before resizing the instance."
            metric_name: "db_avg_memory_pct"
            recommendation: >-
              Cloud SQL instance {{ foreach.item.database_id }} has high memory
              utilization (avg {{ foreach.item.avg_memory_pct | round: 2 }}%
              over 24h) - consider upgrading to a machine type with more
              memory to avoid performance degradation or OOM conditions.
            resource:
              type: "cloudsql_database"
              name: "{{ foreach.item.database_id }}"
              id: "{{ foreach.item.database_id }}"
              key: "{{ foreach.item.project_id }}:{{ foreach.item.region }}:cloudsql_database:{{ foreach.item.database_id }}"
            cloud:
              region: "{{ foreach.item.region }}"
              project: {id: "{{ foreach.item.project_id }}"}
            threshold: "85"
            metric_value: "{{ foreach.item.avg_memory_pct | round: 2 }}"
